name: Fileway checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             curl             wget             file             libxdo-dev             libssl-dev             librsvg2-dev             libayatana-appindicator3-dev             patchelf             libwebkit2gtk-4.1-dev
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
